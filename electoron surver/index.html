<!DOCTYPE html>
<html lang="ja">
<head>
	<link href="index.css" rel="stylesheet" />
	<meta charset="UTF-8">
	<title>コントローラ</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
	<meta name="viewport" content="width=1920">
</head>
<body>
	<div class="body">
	
		<div class="line_folded"></div>
		<div class="line_folded_down"></div>
	

		<div class="Pi_panel">RaspberryPi	Pico2W	Controller</div>
		<div class="tenzi_plate">電気情報</div>
		<div class="time">Time<br>00:00:00</div>
		<div class="wifi">Wifi<br>No Connection</div>
		<div class="bluetooth">Bluetooth<br>No Connection</div>
		<div class="battery">battery<br>None</div>

		<div class="line_folded"></div>
		<div class="line_folded_down"></div>
		
		<div class="giar">
			<div class="giar_1">
				<div class="giars"></div>
			</div>
			<div class="giar_2">
				<div class="giars"></div>
			</div>
			<div class="giar_3">
				<div class="giars"></div>
			</div>
			<div class="giar_line"></div>
			<div class="giar_stick"></div>
		</div>

		<div class="gtR">R</div>
		<div class="gt1">1</div>
		<div class="gt2">2</div>
		<div class="gt3">3</div>
		<div class="gt4">4</div>
		<div class="gt5">5</div>

	
		<div class="radius_boundary">
			<div class="stickgroove_radius"></div>
 		</div>
 		<div class="speed_mater">Speed:0%</div>

 	
 		<div class="speed_square">
			<div class="speed_stick"></div>
			<div class="speed"></div>
		</div>
		<div class="radius">radius:0deg</div>
		
	

		<div class="electricity"></div>
		<p class="number">Number:None</p>
		
	</div>

 	<script src="index.js"></script>
</body>
</html>
